name: Sync upstream tags
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch --force --tags https://github.com/deepseek-ai/deepseek-harness.git '+refs/tags/*:refs/tags/*'
          git push --force --tags origin
