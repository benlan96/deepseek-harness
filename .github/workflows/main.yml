name: Sync upstream including tags
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync from upstream
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "deepseek-ai/deepseek-harness"
          source_branch: "*"
          destination_branch: "*"
          sync_tags: "true"
