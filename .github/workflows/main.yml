name: Sync upstream tags only
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync tags from deepseek-ai/deepseek-harness
        run: |
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream --tags
          # 只推送新增tag，不会删除你仓库已有的tag，也完全不动分支
          git push origin --tags
