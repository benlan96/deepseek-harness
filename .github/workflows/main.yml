name: Sync upstream tags only
on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write   # 新增这一行！专门解决这个报错

jobs:
  sync-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync tags from deepseek-ai/deepseek-harness
        run: |
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream --tags
          git push origin --tags
